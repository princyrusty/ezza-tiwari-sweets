name: Keep Ezza awake

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the site
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 90 https://ezza-tiwari-sweets.onrender.com/api/health
